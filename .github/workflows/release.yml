name: Build & Release

# v로 시작하는 태그(예: v1.0.2)를 push할 때 실행
on:
  push:
    tags:
      - 'v*'
  # 수동 실행도 가능하게
  workflow_dispatch:

jobs:
  # ─── Linux 빌드 ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 아이콘 생성
        run: node scripts/generate-icon.js

      - name: Linux 빌드 (AppImage)
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: todo-dist/*.AppImage

  # ─── Windows 빌드 ──────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 아이콘 생성
        run: node scripts/generate-icon.js

      - name: Windows 빌드 (NSIS + Portable)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            todo-dist/*.exe
            todo-dist/*.exe.blockmap

  # ─── GitHub Release 생성 ───────────────────────────────────────────────────
  release:
    name: GitHub Release 업로드
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Linux 빌드 다운로드
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist-linux

      - name: Windows 빌드 다운로드
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-windows

      - name: GitHub Release 생성 및 파일 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-linux/*.AppImage
            dist-windows/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
