name: Build & Release

# v로 시작하는 태그(예: v1.0.2)를 push할 때 실행
on:
  push:
    tags:
      - 'v*'
  # 수동 실행도 가능하게
  workflow_dispatch:

# 빌드 잡은 read-only, 릴리즈 잡만 write 권한
permissions:
  contents: write

# Actions 런타임을 Node.js 24로 강제 (20 deprecated 경고 해소)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Linux 빌드 ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 아이콘 생성
        run: node scripts/generate-icon.js

      - name: Linux 빌드 (AppImage)
        run: npx electron-builder --linux --publish=never

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: todo-dist/*.AppImage

  # ─── Windows 빌드 ──────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 아이콘 생성
        run: node scripts/generate-icon.js

      - name: Windows 빌드 (NSIS + Portable)
        run: npx electron-builder --win --publish=never

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            todo-dist/*.exe
            todo-dist/*.exe.blockmap

  # ─── Android 빌드 ──────────────────────────────────────────────────────────
  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: JDK 17 설정 (AGP 8.x 요구사항)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 의존성 설치
        run: npm ci

      - name: Capacitor 웹 소스 동기화
        run: npx cap sync android

      - name: gradlew 실행 권한 부여
        run: chmod +x android/gradlew

      - name: Android Debug APK 빌드
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/apk/debug/*.apk

  # ─── GitHub Release 생성 ───────────────────────────────────────────────────
  release:
    name: GitHub Release 업로드
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Linux 빌드 다운로드
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist-linux

      - name: Windows 빌드 다운로드
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-windows

      - name: Android 빌드 다운로드
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: dist-android

      - name: 기존 릴리즈 삭제 (재빌드 시 중복 파일 방지)
        run: gh release delete "${{ github.ref_name }}" --yes --repo ${{ github.repository }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release 생성 및 파일 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-linux/*.AppImage
            dist-windows/*.exe
            dist-android/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
